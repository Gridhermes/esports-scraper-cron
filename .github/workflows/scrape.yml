name: Scheduled Esports Results Scraper

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  trigger-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger scrape
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 120 --retry 0 \
            -X POST "${APP_URL%/}/api/results-history/scheduled-run" \
            -H "Authorization: Bearer ${CRON_SHARED_SECRET}" \
            -H "Content-Type: application/json"
